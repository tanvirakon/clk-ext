<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Time's Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
    <style>
      html {
        background: #fbf7ef;
      }

      body {
        margin: 0;
        padding: 8px 8px;
        width: 100%;
        box-sizing: border-box;
        background: #fbf7ef;
        color: #3d342e;
        font-family: "Patrick Hand", "Comic Sans MS", cursive;
        font-size: 16px;
        border-radius: 14px 18px 12px 20px / 18px 12px 20px 14px;
        box-shadow:
          0 0 0 2px rgba(74, 63, 53, 0.15),
          2px 3px 0 rgba(74, 63, 53, 0.25);
        user-select: none;
        text-align: center;
        overflow: hidden;
      }
      #timer {
        text-align: center;
        font-family: "Gaegu", cursive;
        font-weight: 700;
        font-size: 30px;
        line-height: 1.15;
      }
      /* little sleeping-cat Zzz accent, hidden while the alert is red */
      .zzz-note {
        display: block;
        margin-top: 2px;
        font-family: "Gaegu", cursive;
        font-weight: 700;
        font-size: 14px;
        color: #8c6583;
        letter-spacing: 2px;
      }

      /* --- sketchy pause button (matches stopwatch.html) --- */
      #pauseButton {
        padding: 4px 10px !important;
        background: #7aaed6 !important;
        color: #2b2623 !important;
        border: 2px solid #4a3f35 !important;
        border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px !important;
        cursor: pointer !important;
        font-size: 14px !important;
        font-family: "Patrick Hand", "Comic Sans MS", cursive !important;
        letter-spacing: 0.3px !important;
        box-shadow: 2px 3px 0 rgba(74, 63, 53, 0.25) !important;
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease,
          background 0.15s ease !important;
        margin: 10px auto !important;
        display: block !important;
      }
      #pauseButton:hover {
        transform: translate(-1px, -1px) !important;
        box-shadow: 3px 4px 0 rgba(74, 63, 53, 0.25) !important;
        background: #679ec7 !important;
      }
      #pauseButton:active {
        transform: translate(1px, 2px) !important;
        box-shadow: 0 1px 0 rgba(74, 63, 53, 0.25) !important;
      }
      #pauseButton:focus-visible {
        outline: 2px dashed #2b2623 !important;
        outline-offset: 3px !important;
      }
    </style>
  </head>
  <body>
    <div id="timer">Loading...</div>
    <span class="zzz-note" aria-hidden="true">~ z Z z ~</span>
    <script type="module" src="../js/timer.js"></script>
  </body>
</html>

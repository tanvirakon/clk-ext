<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Pomodoro</title>
  <style>
    body {
      margin: 0;
      padding: 8px;
      background: #1a1a2e;
      color: white;
      font-family: "Comic Sans MS", cursive, sans-serif;
      text-align: center;
      user-select: none;
      transition: background 0.6s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 100vh;
      box-sizing: border-box;
    }

    body.break-mode {
      background: rgba(180, 30, 30, 0.95);
    }

    #progress-ring {
      transition: stroke-dashoffset 1s linear, stroke 0.6s ease;
    }

    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(255, 80, 80, 0.5)); }
      50%       { filter: drop-shadow(0 0 14px rgba(255, 80, 80, 1)); }
    }

    body.break-mode #progress-ring {
      animation: pulse-glow 2s ease-in-out infinite;
    }

    #cycle-count {
      font-size: 11px;
      color: #aaa;
    }

    body.break-mode #cycle-count {
      color: #ffaaaa;
    }

    #stop-pomodoro {
      padding: 4px 10px;
      background: #f44336;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-family: "Comic Sans MS", cursive, sans-serif;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.4);
    }

    #stop-pomodoro:hover {
      background: #c62828;
    }
  </style>
</head>

<body>
  <!-- r=46, circumference ≈ 289 -->
  <svg width="110" height="110" viewBox="0 0 110 110">
    <!-- Track -->
    <circle cx="55" cy="55" r="46" fill="none" stroke="#2e2e4a" stroke-width="7"/>
    <!-- Progress ring, starts at 12 o'clock -->
    <circle id="progress-ring"
      cx="55" cy="55" r="46"
      fill="none" stroke="#ffeb3b" stroke-width="7"
      stroke-dasharray="289" stroke-dashoffset="0"
      stroke-linecap="round"
      transform="rotate(-90 55 55)"/>
    <!-- Timer digits inside the ring -->
    <text id="pomodoro-timer"
      x="55" y="55"
      text-anchor="middle" dominant-baseline="middle"
      font-size="22" font-weight="bold" fill="white"
      font-family="'Courier New', Courier, monospace">50:00</text>
  </svg>

  <div id="cycle-count">Cycle 1</div>
  <button id="stop-pomodoro">Stop</button>

  <script type="module" src="pomodoro.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="timer-container">
      <!-- Peeking ginger tabby, perched on top of the target-time input -->
      <svg class="cat-peek" viewBox="0 0 120 86" aria-hidden="true">
        <!-- wagging tail -->
        <g class="peek-tail">
          <path
            d="M100 78 C 114 76, 119 58, 106 47"
            fill="none"
            stroke="#4a3f35"
            stroke-width="12.5"
            stroke-linecap="round" />
          <path
            d="M100 78 C 114 76, 119 58, 106 47"
            fill="none"
            stroke="#e8a04c"
            stroke-width="9"
            stroke-linecap="round" />
          <path
            d="M100 78 C 114 76, 119 58, 106 47"
            fill="none"
            stroke="#c97e2e"
            stroke-width="9"
            stroke-linecap="round"
            stroke-dasharray="3 11" />
        </g>
        <!-- ears (behind head) -->
        <path d="M35 32 L28 10 L50 21 Z" fill="#e8a04c" stroke="#4a3f35" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M85 32 L92 10 L70 21 Z" fill="#e8a04c" stroke="#4a3f35" stroke-width="2.5" stroke-linejoin="round" />
        <path d="M34 27 L31 15 L43 21 Z" fill="#e8956f" />
        <path d="M86 27 L89 15 L77 21 Z" fill="#e8956f" />
        <!-- head -->
        <path
          d="M30 80 L30 46 Q30 21 60 21 Q90 21 90 46 L90 80 Z"
          fill="#e8a04c"
          stroke="#4a3f35"
          stroke-width="2.5"
          stroke-linejoin="round" />
        <!-- tabby stripes -->
        <path
          d="M50 23 q3 8 1 15 M60 21 q3 9 1 17 M70 23 q-3 8 -1 15"
          fill="none"
          stroke="#c97e2e"
          stroke-width="3.5"
          stroke-linecap="round" />
        <!-- blush -->
        <ellipse cx="38" cy="60" rx="5" ry="3" fill="#f2b28c" opacity="0.7" />
        <ellipse cx="82" cy="60" rx="5" ry="3" fill="#f2b28c" opacity="0.7" />
        <!-- happy closed eyes -->
        <path
          d="M40 50 q7 7 14 0 M66 50 q7 7 14 0"
          fill="none"
          stroke="#4a3f35"
          stroke-width="2.5"
          stroke-linecap="round" />
        <!-- nose & mouth -->
        <path d="M56 60 h8 l-4 6 Z" fill="#e88a7a" stroke="#4a3f35" stroke-width="1.5" stroke-linejoin="round" />
        <path
          d="M60 66 q-1 4 -5 5 M60 66 q1 4 5 5"
          fill="none"
          stroke="#4a3f35"
          stroke-width="1.8"
          stroke-linecap="round" />
        <!-- whiskers -->
        <path
          d="M28 56 L14 52 M28 62 L14 65 M92 56 L106 52 M92 62 L106 65"
          stroke="#4a3f35"
          stroke-width="1.6"
          stroke-linecap="round" />
        <!-- paws draped over the input's edge -->
        <g fill="#f6e7c8" stroke="#4a3f35" stroke-width="2.5">
          <ellipse cx="44" cy="81" rx="10" ry="7.5" />
          <ellipse cx="74" cy="81" rx="10" ry="7.5" />
        </g>
        <path
          d="M40 76 v9 M47 76 v9 M70 76 v9 M77 76 v9"
          fill="none"
          stroke="#4a3f35"
          stroke-width="1.4"
          stroke-linecap="round" />
      </svg>

      <input
        type="time"
        id="target-time"
        class="time-input"
        placeholder="Select time"
      />
      <input
        type="number"
        id="custom-time"
        class="time-input"
        placeholder="Custom time (minutes)"
      />
      <div class="button-row">
        <button id="set-timer" class="timer-button">Set Timer</button>
        <button id="reset-timer" class="timer-button reset">Reset</button>
      </div>
      <div id="countdown" class="countdown"></div>
    </div>

    <!-- New time difference calculator section -->
    <div class="time-diff-container">
      <div class="time-diff-inputs">
        <input
          type="time"
          id="from-time"
          class="time-input"
          placeholder="From"
        />
        <span class="time-separator">to</span>
        <input type="time" id="to-time" class="time-input" placeholder="To" />
      </div>
      <div id="time-difference" class="countdown"></div>
    </div>

    <!-- Dashed pencil divider with a paw print -->
    <div class="pencil-divider" aria-hidden="true">
      <svg class="paw" viewBox="0 0 26 24" width="20" height="18">
        <g fill="#4a3f35">
          <ellipse cx="13" cy="17" rx="7" ry="5.5" />
          <ellipse cx="4.5" cy="10" rx="2.7" ry="3.6" transform="rotate(-18 4.5 10)" />
          <ellipse cx="10" cy="6" rx="2.7" ry="3.6" transform="rotate(-6 10 6)" />
          <ellipse cx="16" cy="6" rx="2.7" ry="3.6" transform="rotate(6 16 6)" />
          <ellipse cx="21.5" cy="10" rx="2.7" ry="3.6" transform="rotate(18 21.5 10)" />
        </g>
      </svg>
    </div>

    <div class="stopwatch-container">
      <button id="start-stopwatch" class="timer-button stopwatch">
        Stopwatch
      </button>
      <button id="start-pomodoro" class="timer-button pomodoro">
        Pomodoro
      </button>
    </div>

    <!-- Curled-up sleeping calico with floating Zzz -->
    <svg class="calico" viewBox="0 0 130 104" aria-hidden="true">
      <defs>
        <clipPath id="calico-body-clip">
          <ellipse cx="72" cy="60" rx="47" ry="31" />
        </clipPath>
        <clipPath id="calico-head-clip">
          <circle cx="35" cy="46" r="21" />
        </clipPath>
      </defs>
      <!-- Zzz -->
      <g class="zzz" fill="#4a3f35" font-family="Gaegu, cursive" font-weight="700">
        <text class="z1" x="66" y="22" font-size="13">z</text>
        <text class="z2" x="82" y="15" font-size="17">Z</text>
        <text class="z3" x="102" y="10" font-size="22">Z</text>
      </g>
      <!-- curled tail -->
      <path
        d="M30 86 C 12 82, 12 64, 28 60"
        fill="none"
        stroke="#4a3f35"
        stroke-width="12"
        stroke-linecap="round" />
      <path
        d="M30 86 C 12 82, 12 64, 28 60"
        fill="none"
        stroke="#3d342e"
        stroke-width="8"
        stroke-linecap="round" />
      <!-- curled body with calico patches -->
      <ellipse cx="72" cy="60" rx="47" ry="31" fill="#f6efe1" />
      <g clip-path="url(#calico-body-clip)">
        <path d="M28 32 Q58 22 80 44 Q62 72 24 64 Z" fill="#e8a04c" />
        <path d="M96 32 Q126 40 120 68 Q100 76 86 60 Q84 42 96 32 Z" fill="#3d342e" />
      </g>
      <ellipse cx="72" cy="60" rx="47" ry="31" fill="none" stroke="#4a3f35" stroke-width="2.5" />
      <!-- ears -->
      <path d="M18 34 L13 15 L34 24 Z" fill="#e8a04c" stroke="#4a3f35" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M42 26 L50 12 L54 30 Z" fill="#f6efe1" stroke="#4a3f35" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M22 30 L20 21 L30 25 Z" fill="#e8956f" />
      <path d="M45 25 L48 18 L50 26 Z" fill="#e8956f" />
      <!-- resting head -->
      <circle cx="35" cy="46" r="21" fill="#f6efe1" />
      <g clip-path="url(#calico-head-clip)">
        <path d="M10 30 Q22 24 34 30 Q30 44 10 44 Z" fill="#e8a04c" />
      </g>
      <circle cx="35" cy="46" r="21" fill="none" stroke="#4a3f35" stroke-width="2.5" />
      <!-- closed eyes -->
      <path
        d="M22 46 q6 5 12 0 M37 48 q6 5 12 0"
        fill="none"
        stroke="#4a3f35"
        stroke-width="2.2"
        stroke-linecap="round" />
      <!-- nose -->
      <path d="M29 53 h6 l-3 4.5 Z" fill="#e88a7a" />
      <!-- whiskers -->
      <path
        d="M16 52 L8 50 M16 57 L8 59 M52 52 L60 50 M52 57 L60 59"
        stroke="#4a3f35"
        stroke-width="1.3"
        stroke-linecap="round" />
    </svg>

    <script type="module" src="popup.js"></script>
  </body>
</html>
